spring:
  application:
    name: ticketbooking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ticketdb}
    username: ${DB_USER:ticket}
    password: ${DB_PASSWORD:ticket}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.nabanita.ticketbooking.event

app:
  hold-ttl: 5m
  jwt:
    # Development default only. Set JWT_SECRET (32+ characters) anywhere else.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789}
    ttl: 2h
  admin:
    email: ${ADMIN_EMAIL:admin@ticketbooking.local}
    password: ${ADMIN_PASSWORD:admin12345}

server:
  port: ${SERVER_PORT:18085}
